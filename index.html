<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codificar en QualCoder 4</title>
<meta name="description" content="Curso interactivo en español para aprender a codificar datos cualitativos en QualCoder 4, con ejercicios, puntos e insignias.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estilos.css">
</head>
<body>

<div class="marco">

    <div class="medidor">

    <nav aria-label="Niveles del curso">

    <div class="insignias">
      <h2>Insignias</h2>
      <div class="insignias-lista"></div>
    </div>

    <button class="reinicio" type="button">Reiniciar mi progreso</button>

  <main class="escenario"></main>

<script src="assets/contenido.js"></script>
