<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codificar en QualCoder 4</title>
<meta name="description" content="Curso interactivo en español para aprender a codificar datos cualitativos en QualCoder 4, con simulador de la interfaz, misiones, vidas, estrellas e insignias.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estilos.css">
</head>
<body>

<header class="hud">
  <span class="hud-titulo">Codificar en QualCoder 4</span>
  <div class="hud-medidor">
    <div class="hud-linea">
      <span class="hud-rango">Aprendiz de campo</span>
      <span class="hud-xp">0 XP</span>
    </div>
    <div class="hud-barra"><i></i></div>
  </div>
  <span class="hud-insignias">✦ 0</span>
  <button class="hud-mapa" type="button">Mapa</button>
  <button class="hud-referencias" type="button">Referencias</button>
  <button class="hud-sonido" type="button" aria-label="Apagar sonido">🔊</button>
  <button class="hud-reinicio" type="button">Reiniciar</button>
</header>

<div class="lienzo">
  <main id="app"></main>
  <aside id="rail" class="rail-nav" aria-label="Contenido del curso"></aside>
</div>

<script src="assets/contenido.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
